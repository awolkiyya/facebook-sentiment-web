name: Deploy Mayor Sentiment Frontend

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "configs/**"
      - "data/**"
      - "features/**"
      - "hooks/**"
      - "i18n/**"
      - "lib/**"
      - "providers/**"
      - "public/**"
      - "services/**"
      - "styles/**"
      - "types/**"
      - "utils/**"
      - ".dockerignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "next.config.ts"
      - "middleware.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

concurrency:
  group: mayor-sentiment-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Next.js to ASI Serv
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 25m

          script: |
            set -eu

            APP_DIR="/opt/asi-platform/apps/facebook-sentiment-web"
            COMPOSE_FILE="docker-compose.yml"
            ENV_FILE=".env.production"

            cd "$APP_DIR"

            echo "=========================================="
            echo "Mayor Sentiment Frontend Deployment"
            echo "Target: ASI Serv"
            echo "=========================================="

            # 1. Validate repository and branch

            if [ ! -d ".git" ]; then
              echo "ERROR: Git repository not found."
              exit 1
            fi

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: Expected main, found $CURRENT_BRANCH"
              exit 1
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree contains local changes."
              git status --short
              exit 1
            fi

            # 2. Update deployment checkout

            echo "Fetching latest main..."

            git fetch origin main
            git merge --ff-only origin/main

            echo "Deploying commit:"
            git log -1 --format='%h %s'

            # 3. Validate required files

            for FILE in \
              "$COMPOSE_FILE" \
              Dockerfile \
              package.json \
              package-lock.json \
              next.config.ts \
              "$ENV_FILE"
            do
              if [ ! -f "$FILE" ]; then
                echo "ERROR: Missing required file: $FILE"
                exit 1
              fi
            done

            if ! grep -q '^NEXT_PUBLIC_API_URL=' "$ENV_FILE"; then
              echo "ERROR: NEXT_PUBLIC_API_URL is missing."
              exit 1
            fi

            if ! grep -q '^WEB_DOMAIN=' "$ENV_FILE"; then
              echo "ERROR: WEB_DOMAIN is missing."
              exit 1
            fi

            # 4. Validate Docker and Traefik

            docker --version
            docker compose version

            if ! docker network inspect traefik-public >/dev/null 2>&1; then
              echo "ERROR: traefik-public network does not exist."
              exit 1
            fi

            # All Compose commands explicitly load .env.production.
            dc() {
              docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" \
                "$@"
            }

            echo "Validating Compose configuration..."
            dc config --quiet

            # 5. Build before replacing the running frontend

            echo "Building production frontend..."
            dc build frontend

            # 6. Deploy frontend only

            echo "Starting frontend..."
            dc up -d --no-deps frontend

            # 7. Wait for frontend HTTP response

            echo "Checking frontend..."

            ATTEMPTS=0
            MAX_ATTEMPTS=30
            HEALTHY=0

            while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
              CONTAINER_ID="$(dc ps -q frontend)"

              if [ -n "$CONTAINER_ID" ]; then
                RUNNING="$(docker inspect \
                  --format '{{.State.Running}}' \
                  "$CONTAINER_ID" 2>/dev/null || true)"

                if [ "$RUNNING" = "true" ]; then
                  if dc exec -T frontend node -e '
                    fetch("http://127.0.0.1:3000")
                      .then(response => {
                        console.log("Frontend HTTP status:", response.status);
                        if (response.status >= 500) process.exitCode = 1;
                      })
                      .catch(error => {
                        console.error("Frontend request failed:", error.message);
                        process.exitCode = 1;
                      });
                  '; then
                    HEALTHY=1
                    break
                  fi
                fi
              fi

              ATTEMPTS=$((ATTEMPTS + 1))
              sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: Frontend health check failed."
              dc ps || true
              dc logs --tail=100 frontend || true
              exit 1
            fi

            # 8. Deployment summary

            dc ps
            dc logs --tail=30 frontend

            echo "=========================================="
            echo "Frontend deployment completed successfully."
            echo "=========================================="
