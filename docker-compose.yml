services:
  frontend:
    container_name: facebook-sentiment-web

    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL in .env.production}

    restart: unless-stopped
    init: true

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    networks:
      - traefik-public

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # HTTP router
      - "traefik.http.routers.sentiment-web.rule=Host(`196.190.216.57`)"
      - "traefik.http.routers.sentiment-web.entrypoints=web"
      - "traefik.http.routers.sentiment-web.priority=1"
      - "traefik.http.routers.sentiment-web.service=sentiment-web"

      # HTTPS router
      - "traefik.http.routers.sentiment-web-secure.rule=Host(`196.190.216.57`)"
      - "traefik.http.routers.sentiment-web-secure.entrypoints=websecure"
      - "traefik.http.routers.sentiment-web-secure.priority=1"
      - "traefik.http.routers.sentiment-web-secure.tls=true"
      - "traefik.http.routers.sentiment-web-secure.service=sentiment-web"

      # Next.js service
      - "traefik.http.services.sentiment-web.loadbalancer.server.port=3000"

networks:
  traefik-public:
    external: true
    name: traefik-public
